# Render Blueprint — free Docker web service for the LeetCode Tracker backend.
# Provision Postgres on Neon (free) separately, then paste its connection
# details into the env vars below (marked sync:false → set in the dashboard).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: lctracker-backend
    runtime: docker
    plan: free
    # Closest free Render region to the Neon DB (Sydney / ap-southeast-2) and to AU users.
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # JDBC URL, e.g. jdbc:postgresql://<host>/<db>?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
