spring:
  application:
    name: lctracker-backend

  # Datasource is env-driven. Local defaults match docker-compose.yml.
  # For Neon, set DATABASE_URL to the JDBC form, e.g.
  #   jdbc:postgresql://<host>/<db>?sslmode=require
  # plus DB_USER / DB_PASSWORD.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lctracker}
    username: ${DB_USER:lctracker}
    password: ${DB_PASSWORD:lctracker}

  jpa:
    # Flyway is the single source of truth for the schema; Hibernate neither
    # generates nor validates it.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

auth:
  google-client-id: ${GOOGLE_CLIENT_ID:}
  google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  github-client-id: ${GITHUB_CLIENT_ID:}
  github-client-secret: ${GITHUB_CLIENT_SECRET:}
  # MUST be overridden in production — signs OAuth state and scopes sessions.
  session-secret: ${AUTH_SESSION_SECRET:dev-insecure-secret-change-me}
  web-origin: ${APP_WEB_ORIGIN:http://localhost:5173}
