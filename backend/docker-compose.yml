# Local Postgres for development. Production uses Neon (set DATABASE_URL).
services:
  db:
    image: postgres:16
    container_name: lctracker-db
    environment:
      POSTGRES_DB: lctracker
      POSTGRES_USER: lctracker
      POSTGRES_PASSWORD: lctracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lctracker -d lctracker"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
